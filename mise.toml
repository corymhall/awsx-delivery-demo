[settings]
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64", "macos-x64"]

[env]
HK_MISE = "1"
# PULUMI_OPTION_REFRESH = "true"
# PULUMI_RUN_PROGRAM = "true"

[tools]
node = "24.22.2"
hk = "1.51.0"
pulumi = "3.277.0"

[deps.npm]
dir = "infra"
auto = true
run = "npm ci"

# Both web projects install the same source component. Run them serially so its
# npm prepare scripts do not modify the same node_modules concurrently.
[deps.web]
auto = true
sources = ["infra-web/Pulumi.yaml", "infra-web/tsconfig.json", "infra-web/tsconfig.pulumi.json", "infra-web/package.json", "infra-web/package-lock.json", "pipeline-web/Pulumi.yaml", "pipeline-web/package.json", "pipeline-web/package-lock.json", "components/awsx-delivery/index.ts", "components/awsx-delivery/src/webFunctionCanary.ts", "components/awsx-delivery/src/webFunctionCanaryRouting.ts"]
outputs = ["infra-web/node_modules", "infra-web/sdks/pulumi-awsx-next", "infra-web/sdks/pulumi-awsx-delivery", "pipeline-web/node_modules", "pipeline-web/sdks/pulumi-awsx-delivery"]
run = "pulumi install --cwd infra-web --non-interactive && pulumi install --cwd pipeline-web --non-interactive"

[tasks.format]
description = "Format infrastructure files"
dir = "infra"
run = "npm run format"

[tasks."format:check"]
description = "Check infrastructure formatting"
dir = "infra"
run = "npm run format:check"

[tasks.lint]
description = "Lint infrastructure TypeScript"
dir = "infra"
run = "npm run lint"

[tasks.typecheck]
description = "Type-check infrastructure TypeScript"
dir = "infra"
run = "npm run typecheck"

[tasks."pipeline:format:check"]
description = "Check pipeline formatting"
dir = "pipeline"
run = "npm run format:check"

[tasks."pipeline:lint"]
description = "Lint pipeline TypeScript"
dir = "pipeline"
run = "npm run lint"

[tasks."pipeline:typecheck"]
description = "Type-check pipeline TypeScript"
dir = "pipeline"
run = "npm run typecheck"

[tasks."identity:format:check"]
description = "Check identity project formatting"
dir = "identity"
run = "npm run format:check"

[tasks."identity:lint"]
description = "Lint identity project TypeScript"
dir = "identity"
run = "npm run lint"

[tasks."identity:typecheck"]
description = "Type-check identity project TypeScript"
dir = "identity"
run = "npm run typecheck"

[tasks."check:hooks"]
description = "Validate the hk configuration"
run = "hk config dump >/dev/null"

[tasks."components:check"]
description = "Check experimental Delivery components and Lambda"
dir = "components/awsx-delivery"
run = "npm run check"

[tasks."infra-web:check"]
description = "Check Lambda Web Function infrastructure"
dir = "infra-web"
run = "npm run check"

[tasks."pipeline-web:check"]
description = "Check the Lambda Web Function Delivery pipeline"
dir = "pipeline-web"
run = "npm run check"

[tasks.validate]
description = "Run all repository checks"
depends = ["format:check", "lint", "typecheck", "pipeline:format:check", "pipeline:lint", "pipeline:typecheck", "identity:format:check", "identity:lint", "identity:typecheck", "components:check", "check:hooks", "infra-web:check", "pipeline-web:check"]

[tasks."hooks:install"]
description = "Install repository Git hooks through mise"
run = "hk install --mise"
